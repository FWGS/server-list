name: Probe and publish

on:
  push:
    branches: [master, main]
  workflow_dispatch:
    inputs:
      runner:
        description: >-
          Runner label to probe from. Blacksmith's network reaches servers that GitHub's cannot, so a script sends a run there periodically to keep those entries inside the grace window.
        type: choice
        default: ubuntu-slim
        options:
          - ubuntu-slim
          - blacksmith-2vcpu-ubuntu-2404-arm

# Serialize runs; never cancel an in-flight probe (the last writer wins).
concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    # slim has everything we need and more, and it's super fast to setup.
    # Anything but a dispatch that says otherwise runs on GitHub.
    runs-on: ${{ github.event.inputs.runner || 'ubuntu-slim' }}
    steps:
      - uses: actions/checkout@v6

      - name: Download latest xash3d-query
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            x86_64)  target=x86_64-unknown-linux-gnu ;;
            aarch64) target=aarch64-unknown-linux-gnu ;;
            *) echo "::error::no xash3d-query build for $(uname -m)"; exit 1 ;;
          esac
          mkdir -p .xash3d-master
          cd .xash3d-master
          gh release download continuous \
            --repo FWGS/xash3d-master \
            --pattern "*${target}*"
          tar --use-compress-program=unzstd -xf xash3d-master-*.tar.zst
          chmod +x xash3d-query
          ./xash3d-query --version

      - name: Seed previous probe state
        run: |
          mkdir -p output
          # fall back to an empty state if broken
          curl -fsSL --retry 3 -o output/state.json \
            "https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY##*/}/state.json" \
            || echo '{}' > output/state.json

      - name: Probe servers
        run: |
          set -o pipefail
          ./scripts/probe.py \
            --query ./.xash3d-master/xash3d-query \
            --sources ./servers \
            --output ./output \
            --grace-hours 48 \
            2>&1 | tee ./output/probe.log

      - name: Force-push to gh-pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd output
          # single commit gh-pages to not bloat the repo
          git init -q -b gh-pages
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "publish ${{ github.run_id }} (${GITHUB_SHA:0:7})"
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
